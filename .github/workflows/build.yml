
name: Build OPKITS V1

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract source
        run: |
          mkdir source
          unzip -q OPKITS-V1-Source.zip -d source

      - name: Build plugin
        run: |
          BUILD_FILE=$(find source \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)
          test -n "$BUILD_FILE"
          cd "$(dirname "$BUILD_FILE")"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: OPKITS-V1-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
